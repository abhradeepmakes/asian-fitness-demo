name: Rename to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "abhradeepmakes"
          git config user.email "abhradeepmakes@users.noreply.github.com"
          git mv asian-fitness-demo-website.html index.html
          git commit -m "Rename to index.html"
          git push
